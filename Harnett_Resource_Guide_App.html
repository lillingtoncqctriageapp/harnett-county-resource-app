<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harnett County Resource Guide</title>
<style>
:root{--navy:#204D88;--deep:#15325C;--gold:#FFCE3A;--sage:#7A9A88;
 --bg:#dfe6ef;--surface:#fff;--card:#f4f7fb;--ink:#14213d;--muted:#475569;--line:#cfd8e4;--accent:#204D88;--selbg:#e3edfa;--selb:#204D88;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--surface:#1e293b;--card:#0f172a;--ink:#f1f5f9;--muted:#b6c2d3;--line:#3a4a63;--accent:#FFCE3A;--selbg:#243b5e;--selb:#FFCE3A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
@media (min-width:520px){.app{height:min(860px,calc(100dvh - 32px));margin:16px auto;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:12px 8px;min-height:48px}
.head{padding:0 16px 10px}
h1,h2,h3,p{margin:0}
h2{font-size:26px;line-height:1.2}
.hint{color:var(--muted);margin-top:4px;font-size:16px}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 18px;border-radius:14px;border:0;font-weight:700;font-size:18px;text-decoration:none;text-align:center;background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:#14213d}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* Welcome */
#welcome{background:linear-gradient(180deg,#183961,#204D88 55%,#15325c);color:#fff;text-align:center;padding:calc(28px + env(safe-area-inset-top,0px)) 28px calc(24px + env(safe-area-inset-bottom,0px));justify-content:space-between;align-items:center}
.badge{border:1px solid rgba(163,201,180,.6);background:rgba(122,154,136,.25);color:#d6ecde;font-weight:700;padding:6px 14px;border-radius:999px;font-size:15px}
.logo{font-size:64px;width:120px;height:120px;display:grid;place-items:center;border-radius:50%;border:3px solid var(--sage);background:rgba(15,23,42,.35);margin:0 auto 22px}
#welcome h1{font-size:38px;line-height:1.1;margin-bottom:12px}
#welcome .sub{font-size:19px;color:#e2e8f0;max-width:22em;margin:0 auto}
#welcome .small{margin-top:14px;font-size:15px;color:#cbd5e1}
/* Categories */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px;padding:12px 8px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:center}
.tile .em{font-size:36px;line-height:1.1}
.tile .nm{font-weight:700;font-size:16px;line-height:1.2}
.tile .ct{font-size:14px;color:var(--muted)}
.tile[aria-pressed=true]{border-color:var(--selb);background:var(--selbg);box-shadow:inset 0 0 0 1px var(--selb)}
.tile[aria-pressed=true]::after{content:"✓";position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--selb);color:var(--surface);font-weight:800;font-size:15px;line-height:24px}
/* Results */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.item .em{font-size:30px;line-height:1.1;flex:none;width:36px;text-align:center}
.item .body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.item strong{font-size:18px;line-height:1.25}
.item .tag{font-size:15px;font-weight:600;color:var(--accent)}
.item .ln{font-size:16px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .go{align-self:center;font-size:24px;color:var(--muted)}
.empty{text-align:center;padding:48px 12px;color:var(--muted)}
/* Detail */
#detail{position:absolute;inset:0;z-index:5;background:var(--surface);display:flex;flex-direction:column}
.dhead{padding:4px 0 12px}
.dhead h2{font-size:25px}
.dhead .tag{color:var(--accent);font-weight:700;margin-top:4px}
.acts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.acts .btn{min-height:52px}
.row{padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:10px}
.row dt{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:2px}
.row dd{margin:0;font-size:17px;overflow-wrap:anywhere;white-space:pre-line}
.row a{color:var(--accent);font-weight:600}
.warn{background:#fff4cc;color:#4a3800;border:1px solid #e6c34d;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:16px}
details.report{margin:14px 0 8px;border:1px solid var(--line);border-radius:12px;padding:4px 14px}
details.report summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.report label{display:flex;gap:10px;align-items:center;min-height:44px}
details.report input{width:22px;height:22px;accent-color:var(--navy)}
details.report .btn{margin:10px 0 12px;min-height:48px;font-size:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--gold);color:#14213d;padding:14px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:50}
@media (prefers-reduced-motion:no-preference){#detail{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
</style>
</head>
<body>
<main class="app">

<section id="welcome" class="screen">
  <span class="badge">Harnett County, NC</span>
  <div>
    <div class="logo" aria-hidden="true">🌳</div>
    <h1>Harnett County Resource Guide</h1>
    <p class="sub">Find local help with food, housing, health care, recovery, and more.</p>
  </div>
  <div style="width:100%">
    <button class="btn gold" id="start">Tap to Continue</button>
    <p class="small" id="count-badge"></p>
  </div>
</section>

<section id="pick" class="screen" hidden>
  <div class="top">
    <button class="link" data-go="welcome">← Back</button>
    <button class="link" id="select-all">Select all</button>
  </div>
  <div class="head">
    <h2>What do you need help with?</h2>
    <p class="hint">Tap everything that applies, then tap Next.</p>
  </div>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="foot"><button class="btn gold" id="next" disabled>Next</button></div>
</section>

<section id="results" class="screen" hidden>
  <div class="top"><button class="link" data-go="pick">← Change choices</button></div>
  <div class="head">
    <h2 id="r-title">Resources</h2>
    <p class="hint" id="r-sub" aria-live="polite"></p>
  </div>
  <div class="scroll"><div class="list" id="list"></div></div>
</section>

<section id="detail" hidden aria-label="Resource details">
  <div class="top"><button class="link" id="close">← Back to list</button></div>
  <div class="scroll" id="d-body"></div>
</section>

</main>
<div id="toast" role="status" hidden></div>

 Closed Weekends","services":"Supplemental Nutrition program for women, infants, and children up to 5 years of age","notes":"Monthly EBT benefits for healthy foods, breastfeeding support, nutrition education, and referrals to healthcare and community resources; Who is WIC for? Children up to 5 years of age Infants Pregnant women Breastfeeding women who have had a baby in the last 12 months Women who have had a baby in the last 6 months When you apply for WIC please provide: Proof of identification (for all individuals applying for WIC) Proof of income (for all household members with income) Proof of residence (where you live) Examples of what you will need to provide: Identification: (Only one is needed) - Valid driver's license, Social Security card, current work/school ID, current Medicaid card, current military ID, birth certificate, immunization record, and for infants: hospital crib card, ID bracelet or mother’s verification of facts form. Residence (where you live): (Only one is needed) - Current utility bill, valid driver’s license, current Medicaid card (or presumptive eligibility form), bank statement, current rental or mortgage receipts, Division of Motor Vehicle ID card. Income: Current paycheck stubs, if self-employed your recent tax return or history of earnings for the past twelve months, current Medicaid card, a letter of certification for the NC Food and Nutrition Services, a letter from your employer stating gross income and frequency of pay, unemployment letter/notice.","web":"https://www.harnett.org/health/women-infants-children-wic.asp","webText":"","gender":"Women","fee":"Free","stay":"","moud":"","verified":"2026-10-15"},{"id":35,"cat":"Food & Nutrition","sub":"","name":"Meals on Wheels","addr":"309 W. Cornelius Harnett Blvd., Lillington, NC 27546","phone":"910-814-6265","hours":"9AM - 5PM; Closed Weekends -- Casey Todd can be contacted at 910-893-7578 or via email at ctodd@harnett.org for additional information","services":"At home meal delive /* ---------- Settings you can edit ---------- */
const EMOJI = {"Clothing":"👕","Education":"📚","Employment Services":"💼","Financial Assistance":"💵","Food & Nutrition":"🍲","Food Pantry":"🥫","Healthcare":"💊","Housing":"🏠","Legal Aid":"⚖️","Mental Health":"🧠","Other":"📍","SUD Residential":"🏡","Support Group":"🤝","Transitional/Sober Living":"🔑","Transportation":"🚍"};
// Order of the category buttons. Any category not listed here is still shown (added after these).
const ORDER = ["SUD Residential","Transitional/Sober Living","Mental Health","Healthcare","Food Pantry","Food & Nutrition","Housing","Financial Assistance","Legal Aid","Employment Services","Education","Support Group","Clothing","Transportation","Other"];

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const emoji = cat => EMOJI[cat] || "📍";
const PHONE_RE = /\(?\b\d{3}\)?[\s.-]*\d{3}[\s.-]*\d{4}\b|\b988\b/g;

// Categories come from the data itself, so a resource can never be left without a button.
const cats = [...new Set(DATA.map(r => r.cat))].sort((a, b) => {
  const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
});
const counts = {};
DATA.forEach(r => counts[r.cat] = (counts[r.cat] || 0) + 1);
const selected = new Set();

/* ---------- Navigation (phone Back button works too) ---------- */
const SCREENS = ["welcome", "pick", "results"];
let lastCard = null;
function show(name) {
  const isDetail = name === "detail";
  $("detail").hidden = !isDetail;
  if (!isDetail) SCREENS.forEach(s => $(s).hidden = s !== name);
}
function go(name) {
  show(name);
  try { history.pushState({ name }, ""); } catch (e) {}
}
addEventListener("popstate", e => show((e.state && e.state.name) || "welcome"));
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) go(b.dataset.go);
});

/* ---------- Screen 1 ---------- */
$("count-badge").textContent = `${DATA.length} local resources • Works offline`;
$("start").onclick = () => go("pick");

/* ---------- Screen 2 ---------- */
function drawTiles() {
  $("grid").innerHTML = cats.map(c => `
    <button class="tile" data-cat="${esc(c)}" aria-pressed="${selected.has(c)}">
      <span class="em" aria-hidden="true">${emoji(c)}</span>
      <span class="nm">${esc(c)}</span>
      <span class="ct">${counts[c]} listed</span>
    </button>`).join("");
  $("select-all").textContent = selected.size === cats.length ? "Clear all" : "Select all";
  $("next").disabled = selected.size === 0;
  $("next").textContent = selected.size ? `Next (${selected.size} selected)` : "Choose at least one";
}
$("grid").onclick = e => {
  const t = e.target.closest(".tile");
  if (!t) return;
  const c = t.dataset.cat;
  selected.has(c) ? selected.delete(c) : selected.add(c);
  drawTiles();
  const again = $("grid").querySelector(`[data-cat="${CSS.escape(c)}"]`);
  if (again) again.focus();
};
$("select-all").onclick = () => {
  selected.size === cats.length ? selected.clear() : cats.forEach(c => selected.add(c));
  drawTiles();
};
$("next").onclick = () => { drawResults(); go("results"); $("results").querySelector(".scroll").scrollTop = 0; };

/* ---------- Screen 3 ---------- */
let shown = [];
function drawResults() {
  const order = c => cats.indexOf(c);
  shown = DATA.filter(r => selected.has(r.cat))
    .sort((a, b) => order(a.cat) - order(b.cat) || a.name.localeCompare(b.name));
  $("r-title").textContent = shown.length === 1 ? "1 resource found" : `${shown.length} resources found`;
  $("r-sub").textContent = selected.size > 3 ? `From ${selected.size} categories` : [...selected].sort((a, b) => order(a) - order(b)).map(c => emoji(c) + " " + c).join(", ");
  $("list").innerHTML = shown.length ? shown.map((r, i) => `
    <button class="item" data-i="${i}">
      <span class="em" aria-hidden="true">${emoji(r.cat)}</span>
      <span class="body">
        <strong>${esc(r.name)}</strong>
        ${r.sub ? `<span class="tag">${esc(r.sub)}</span>` : ""}
        <span class="ln">📞 ${esc(r.phone || "Phone not listed")}</span>
        <span class="ln">📍 ${esc(r.addr || "Address not listed")}</span>
        <span class="ln">🕒 ${esc(r.hours || "Call for hours")}</span>
      </span>
      <span class="go" aria-hidden="true">›</span>
    </button>`).join("") : `<div class="empty"><p style="font-size:40px">🔍</p><p>No resources found.</p></div>`;
}
$("list").onclick = e => {
  const b = e.target.closest(".item");
  if (!b) return;
  lastCard = b;
  openDetail(shown[+b.dataset.i]);
};

/* ---------- Detail ---------- */
const fmtDate = iso => {
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
};
function row(label, html) { return html ? `<dl class="row"><dt>${label}</dt><dd>${html}</dd></dl>` : ""; }

function openDetail(r) {
  // Tap-to-call buttons for every number found in the phone field
  const nums = [...new Set((r.phone.match(PHONE_RE) || []).map(n => n.replace(/\D/g, "")))].slice(0, 3);
  const callBtns = nums.map(n => {
    const label = n.length === 10 ? `${n.slice(0,3)}-${n.slice(3,6)}-${n.slice(6)}` : n;
    return `<a class="btn gold" href="tel:${n}">📞 Call ${label}</a>`;
  }).join("");
  const maps = r.addr ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.name + ", " + r.addr)}">🗺️ Get directions</a>` : "";
  const web = r.web ? `<a class="btn" target="_blank" rel="noopener" href="${esc(r.web)}">🌐 Visit website</a>` : "";
  const verified = r.verified
    ? row("Information last verified", esc(fmtDate(r.verified)))
    : `<div class="warn">⚠️ This listing hasn’t been verified recently. Please call to confirm before you go.</div>`;

  $("d-body").innerHTML = `
    <div class="dhead">
      <h2>${emoji(r.cat)} ${esc(r.name)}</h2>
      <p class="tag">${esc(r.cat)}${r.sub ? " • " + esc(r.sub) : ""}</p>
    </div>
    <div class="acts">${callBtns}${maps}${web}</div>
    ${row("Phone", esc(r.phone))}
    ${row("Address", esc(r.addr))}
    ${row("Hours", esc(r.hours || "Call for hours"))}
    ${row("Services", esc(r.services))}
    ${row("Eligibility & notes", esc(r.notes))}
    ${row("Fee", esc(r.fee))}
    ${row("Gender served", esc(r.gender))}
    ${row("Length of stay", esc(r.stay))}
    ${row("Medication for opioid use (MOUD) allowed", esc(r.moud))}
    ${!r.web && r.webText ? row("Website / social", esc(r.webText)) : ""}
    ${verified}
    <details class="report">
      <summary>Is something wrong on this page?</summary>
      <p class="hint" style="margin-bottom:6px">Pick the problem:</p>
      ${["Permanently closed","Wrong address","Wrong phone number","Wrong hours","Something else"].map(t => `<label><input type="radio" name="issue" value="${t}"> ${t}</label>`).join("")}
      <button class="btn gold" id="send-report">Send report</button>
    </details>`;
  $("send-report").onclick = () => submitReport(r);
  $("d-body").scrollTop = 0;
  go("detail");
  $("close").focus();
}
$("close").onclick = () => { show("results"); try { history.back(); } catch (e) {} if (lastCard) lastCard.focus(); };

/* NOTE: this only shows a message. To really collect reports, send { id: r.id, issue } to a form, email, or spreadsheet here. */
function submitReport(r) {
  const pick = document.querySelector('input[name="issue"]:checked');
  toast(pick ? "Thank you! The resource manager will review this." : "Please choose a problem first.");
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidden = true, 3500);
}

/* ---------- Start ---------- */
try { history.replaceState({ name: "welcome" }, ""); } catch (e) {}
drawTiles();
</script>
</body>
</html>
